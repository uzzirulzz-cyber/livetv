name = "playbeat-live"
main = "src/worker/playbeat-proxy.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
DOMAIN = "playbeat.live"
ALLOWED_ORIGIN = "*"
CLOUDFLARE_DOH_URL = "https://cloudflare-dns.com/dns-query"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "playbeat-catalog"
database_id = "75e2c1c3-a1cc-4b6d-b8f4-4afb403f3e2b"
migrations_dir = "migrations"
