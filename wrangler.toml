name = "playbeat-live"
main = "src/worker/playbeat-proxy.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[limits]
cpu_ms = 30000

[triggers]
crons = ["0 */6 * * *"]

[vars]
DOMAIN = "playbeat.live"
ALLOWED_ORIGIN = "*"
CLOUDFLARE_DOH_URL = "https://cloudflare-dns.com/dns-query"
ENVIRONMENT = "production"
PLAYBACK_BASE_URL = "https://playbeat.live/broadcast-player"
GEOTV_ALLOWED_ORIGIN = "http://stream.playbeat.live"
ALLOW_INSECURE_GEOTV = "true"

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "playbeat-live-catalog"
database_id = "b6ad1b87-ad22-4167-a013-0ab26bdbf281"
migrations_dir = "migrations"

