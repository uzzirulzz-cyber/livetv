name: Deploy PlayBeat Storefront

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Verify and deploy storefront only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Verify broadcast bridge
        run: npm test
      - name: Build storefront
        run: npm run build
      - name: Deploy storefront Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1f230ccf421d89de0f68562da95f005d
          command: deploy --config wrangler.storefront.toml
