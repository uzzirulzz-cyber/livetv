name: Verify PlayBeat Storefront

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Cloudflare Workers Builds owns production deployment from main.
# It uses the existing token in the account that owns playbeat-storefront.
jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify live storefront
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Verify broadcast bridge
        run: npm test
      - name: Build storefront
        env:
          VITE_LIVE_ONLY: "true"
        run: npm run build
